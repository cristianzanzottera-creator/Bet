[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bet"
version = "0.1.0"
description = "Strategie in-play per Betfair Exchange (tennis): regole in YAML, motore e simulazione"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bet = "bet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
